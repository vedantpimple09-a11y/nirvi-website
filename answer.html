
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4f7">
  <title>One Honest Answer ♡</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="flower">🫶🏻</div>
    <p class="eyebrow">JUST ONE HONEST QUESTION</p>
    <h1>Could there be<br><span>an us again?</span></h1>

    <p class="intro">
      No pressure, Nirvi.<br>
      I just want to understand how you truly feel. 🤍
    </p>

    <div class="choices">
      <button type="button" class="button" data-choice="yes">Yes ❤️</button>
      <button type="button" class="button secondary" data-choice="time">I need time 🤍</button>
      <button type="button" class="button tertiary" data-choice="no">I don't feel the same</button>
    </div>

    <p id="answer" class="response" role="status" aria-live="polite"></p>
    <p class="tiny">Whatever you feel, honesty matters to me. ♡</p>
    <a class="back-link" href="./letter.html">← Read the letter again</a>
  </main>
</body>
</html>
